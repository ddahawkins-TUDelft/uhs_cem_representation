
import: # Import other files from paths relative to this file, or absolute paths
  - "technologies.yaml" 
  - "locations.yaml" 
  - "scenarios.yaml" 

config:
  name: uhs_cem_representation
  calliope_version: 0.7.0
  mode: base
  broadcast_input_data: true
  math_paths:
      uhs_storage_formulations: "custom_mathematics/uhs_storage_formulations.yaml"
  extra_math:
      - uhs_storage_formulations
  pre_validate_math_strings: true

data_definitions:
  objective_cost_weights: 
    data: 1
    index: monetary
    dims: costs
  bigM: 1e6
  cost_interest_rate:
    data: 0.10
    index: monetary
    dims: costs

data_tables:
  time_varying_parameters:
    table: ../data_tables/full_horizon/time_varying_parameters.csv
    rows: timesteps
    columns: [comment, nodes, techs, parameters]
    drop: comment
    rename_dims:
      parameters: inputs